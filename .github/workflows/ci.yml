name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Floor: 0.21.5 (requires_hermes in plugin.yaml) = the v2026.9.24 release;
  # core's version gate compares semver base versions, so the floor matrix row
  # below is the commit of that release and the manifest floor is its semver,
  # not the date tag.
  HERMES_PIN: f97608f178d1ffeca59860195ab7da295f7c8e5f
  # Latest stable, kept current by the upstream-drift lane (repo-admin law:
  # measure the floor, don't guess it — and never let an upgrading user be the
  # first to discover contract drift). Proven green locally at this branch
  # point: scratch venv (Python 3.14) editable install at tag v0.21.6
  # (commit f27cdbce5ab63eafe8633b293a75151409da5769) -> `hermes plugins
  # validate .` rc=0, 2026-10-12. Re-pinned to v0.21.7 per review N1
  # (releases/latest as of this PR); compat job proves it at head.
  HERMES_LATEST: v0.21.7

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS deps (lockfile-pinned)
        run: npm ci

      - name: Build desktop bundle
        run: node scripts/build.mjs

      - name: Test suite (python + node, serial)
        run: python3 scripts/suite.py . out

      - name: Committed bundle must equal a fresh build
        run: git diff --exit-code desktop/plugin.js

      - name: Desktop half parses as ESM
        run: cp desktop/plugin.js /tmp/plugin.check.mjs && node --check /tmp/plugin.check.mjs

      - name: Checkout pinned hermes-agent (floor)
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout "$HERMES_PIN"

      - name: Install pinned hermes (editable)
        run: pip install -e /tmp/hermes-agent

      - name: Validate plugin against pinned hermes
        run: hermes plugins validate .

      - name: Scrub audit — publish tree must build with 0 private-string hits
        run: python3 scripts/make_public.py /tmp/public-tree

  # The only hermes-dependent gates are the validate steps above, and `gates`
  # already covers the floor under its protected check name. This companion
  # job covers the other end of the supported range: latest stable. Contract
  # drift on supported-upgrade hermes is then caught by CI, not by users.
  compat-latest:
    name: validate @ latest stable
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # v0.21.6+ release metadata gates all core deps on Python >=3.14;
          # 3.11 installs hermes-agent with zero deps and validate dies on
          # 'import ruamel' (job 114783692561, review B1). The floor sibling
          # above legitimately stays 3.11 — its pin predates the markers.
          python-version: "3.14"

      - name: Checkout hermes-agent @ ${{ env.HERMES_LATEST }}
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout "$HERMES_LATEST"

      - name: Install hermes (editable)
        run: pip install -e /tmp/hermes-agent

      - name: Validate plugin
        run: hermes plugins validate .
