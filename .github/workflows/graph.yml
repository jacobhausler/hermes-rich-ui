# Rebuild the committed knowledge graph on main.
#   - graphify parses the tree (AST only, no LLM, no API key) via uvx — no pip install needed.
#   - ONLY graphify-out/graph.json + graphify-out/GRAPH_REPORT.md are committed
#     (the rest of graphify-out/ — cache, backups, html — is gitignored).
#   - No-op guard: if the fresh graph.json minus its `built_at_commit` field equals the
#     committed one, the commit step is skipped entirely (no churn commits on no-op rebuilds).
#
# Local equivalent:
#   uvx --from graphifyy graphify update . --no-cluster
#   git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md && git commit
name: graph

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Rebuild knowledge graph (AST only, FULL rebuild)
        run: |
          set -euo pipefail
          # Full rebuild: a stale/empty committed graph.json kills graphify's
          # incremental merge ("Cannot read graphify-out/graph.json for
          # incremental merge"), so drop it and rebuild from scratch.
          rm -f graphify-out/graph.json
          uvx --from graphifyy graphify update . --no-cluster

      - name: De-absolutize paths (runner workspace paths must never be committed)
        run: |
          set -euo pipefail
          [ -f graphify-out/graph.json ] || exit 0
          # Strip both the $GITHUB_WORKSPACE/ and $HOME/ prefixes (on runners
          # HOME points into the runner home directory, so removing both keeps
          # the file free of absolute runner paths). No absolute-path literal
          # appears in this workflow — the survival greps target the literal
          # $HOME / $GITHUB_WORKSPACE tokens sed would have left behind.
          sed -i "s|$GITHUB_WORKSPACE/||g" graphify-out/graph.json
          sed -i "s|$HOME/||g" graphify-out/graph.json
          grep -q '\$HOME' graphify-out/graph.json && { echo "::error::absolute runner paths survived"; exit 1; } || true
          grep -q '\$GITHUB_WORKSPACE' graphify-out/graph.json && { echo "::error::workspace paths survived"; exit 1; } || true

      - name: Commit only if the graph actually changed
        env:
          # MUST be a distinct user identity (repo-scoped fine-grained PAT), NOT github.token:
          # 1) job-token has no pull-requests permission -> gh pr create 403s (round-2 B1);
          # 2) workflows triggered by GITHUB_TOKEN never fire further workflows, so gates
          #    would never run on the chore/graph PR head and ruleset auto-merge stalls (B2).
          # A fine-grained PAT user identity fires pull_request triggers like any member PR.
          GH_TOKEN: ${{ secrets.GRAPH_PR_PAT }}
        run: |
          set -euo pipefail
          NEW=graphify-out/graph.json
          if [ ! -f "$NEW" ]; then
            echo "::error::graphify did not produce $NEW"
            exit 1
          fi
          # Strip volatile built_at_commit from the fresh copy for the comparison
          python3 - "$NEW" <<'PYEOF'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          def drop(o):
              if isinstance(o, dict):
                  o.pop('built_at_commit', None)
                  [drop(v) for v in o.values()]
              elif isinstance(o, list):
                  [drop(v) for v in o]
          drop(d)
          json.dump(d, open(p + '.cmp', 'w'), sort_keys=True)
          PYEOF
          if git cat-file -e "HEAD:graphify-out/graph.json" 2>/dev/null; then
            git show "HEAD:graphify-out/graph.json" > /tmp/head-graph.json
            python3 - /tmp/head-graph.json <<'PYEOF'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          def drop(o):
              if isinstance(o, dict):
                  o.pop('built_at_commit', None)
                  [drop(v) for v in o.values()]
              elif isinstance(o, list):
                  [drop(v) for v in o]
          drop(d)
          json.dump(d, open(p + '.cmp', 'w'), sort_keys=True)
          PYEOF
            if cmp -s /tmp/head-graph.json.cmp "$NEW.cmp"; then
              echo "graph.json minus built_at_commit == HEAD — no-op, nothing to commit"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json
          if [ -f graphify-out/GRAPH_REPORT.md ]; then git add graphify-out/GRAPH_REPORT.md; fi
          if git diff --cached --quiet; then
            echo "no staged graph changes — no-op"
            exit 0
          fi
          # protect-main ruleset (GH013): direct pushes to main are declined —
          # push a branch, open a PR, and let the required gates check + squash
          # auto-merge land it (fix per #46). [skip ci] removed so `gates`
          # actually runs on the PR; otherwise auto-merge would stall.
          BR="chore/graph-${GITHUB_SHA::7}"
          git commit -m "chore(graph): rebuild graphify knowledge graph"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BR}"
          # F1 (#48 review): no --label chore — that label does not exist on this
          # repo and gh fails the whole create. F3 nit: no bare `|| true` (and no
          # pipe, which would mask gh's exit code); the only tolerated create
          # failure is the already-exists case (same-sha re-run).
          if ! PR_CREATE_OUT=$(gh pr create --base main --head "${BR}" --title "chore(graph): rebuild graphify knowledge graph (${GITHUB_SHA::7})" --body "Automated graph rebuild from main ${GITHUB_SHA}; legit diff per the no-op cmp guard. Part of #46." 2>&1); then
            printf '%s\n' "${PR_CREATE_OUT}"
            printf '%s\n' "${PR_CREATE_OUT}" | grep -qi 'already exists' || { echo "::error::gh pr create failed"; exit 1; }
          fi
          gh pr merge --auto --squash "${BR}"
